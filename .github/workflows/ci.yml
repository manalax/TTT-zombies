name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: gdformat
        run: gdformat --check src tests
      - name: gdlint
        run: gdlint src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (standard build; no C# yet)
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import || true'
      - name: Run gdUnit4
        run: scripts/run_tests.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-report
          path: reports/
